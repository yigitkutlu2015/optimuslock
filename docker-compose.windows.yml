# WINDOWS (Docker Desktop) için Tailscale yan konteyneri.
#
# Docker Desktop'ta "network_mode: host" Windows'a Tailscale arayüzü eklemez; bu yüzden
# konteyner "userspace" modunda çalışır ve iki köprü kurar:
#   * Öğretmen: Tailscale ağına 127.0.0.1:1055 SOCKS5 proxy'si ile çıkar (Optimuslock bunu otomatik kullanır).
#   * Öğrenci : Tailscale'den gelen 5710 bağlantısını Windows'taki Optimuslock'a yönlendirir
#               (Optimuslock açılırken `tailscale serve` ile otomatik ayarlar).
#
# Kullanım (Docker Desktop açık, WSL2 modu önerilir):
#   copy .env.example .env      -> TS_AUTHKEY ve TS_HOSTNAME değerlerini düzenleyin
#   docker compose -f docker-compose.windows.yml up -d
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: optimuslock-tailscale
    hostname: ${TS_HOSTNAME:-optimuslock-pc}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_HOSTNAME=${TS_HOSTNAME:-optimuslock-pc}
      - TS_SOCKS5_SERVER=0.0.0.0:1055
    ports:
      - "127.0.0.1:1055:1055"     # SOCKS5 sadece bu bilgisayardan erişilebilir
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ts-state:/var/lib/tailscale
    restart: unless-stopped

volumes:
  ts-state:
